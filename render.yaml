# Render Blueprint cho backend HealthMate.
# Deploy: Render Dashboard > New > Blueprint > chọn repo này.
# Các biến có "sync: false" sẽ để trống và bạn nhập giá trị trong dashboard
# (tránh commit secret vào repo).
services:
  - type: web
    name: healthmate-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci
    startCommand: npm start
    # Render tự ping "/" để health check; index.js đã trả "API is working".
    healthCheckPath: /
    envVars:
      # KHÔNG khai PORT: Render tự inject PORT và code đọc process.env.PORT.
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # URL frontend đã deploy (Vercel) — dùng cho redirect Stripe & tham chiếu client.
      - key: CLIENT_SITE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPLOAD_PRESET
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PHONE_NUMBER
        sync: false
